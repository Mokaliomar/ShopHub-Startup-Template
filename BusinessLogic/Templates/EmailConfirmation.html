<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <!-- Header -->
        <tr>
            <td align="center" style="background-color: #2c3e50; padding: 25px; color: #ffffff;">
                <h1 style="margin: 0; font-size: 24px;">🛍️ Welcome to Our Store</h1>
            </td>
        </tr>
        <!-- Content -->
        <tr>
            <td style="padding: 30px; color: #333333; line-height: 1.6;">
                <h2 style="color: #2c3e50; margin-top: 0;">Hello {{UserName}} 👋</h2>
                <p>Thank you for signing up! Please confirm your email address to activate your account and access all features.</p>
                <div style="text-align: center; margin: 30px 0;">
                    <a href="{{ConfirmationLink}}" style="background-color: #27ae60; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">Confirm Account Now 🚀</a>
                </div>
                <p style="font-size: 13px; color: #7f8c8d;">If you did not create an account, you can safely ignore this email.</p>
            </td>
        </tr>
        <!-- Footer -->
        <tr>
            <td align="center" style="background-color: #ecf0f1; padding: 15px; font-size: 12px; color: #7f8c8d;">
                <p style="margin: 0;">All rights reserved © {{Year}}</p>
            </td>
        </tr>
    </table>
</body>
</html>
